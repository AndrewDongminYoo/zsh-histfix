# This file controls the behavior of Trunk: https://docs.trunk.io/cli
# To learn more about the format of this file, see https://docs.trunk.io/reference/trunk-yaml
version: 0.1
cli:
  version: 1.25.0
plugins:
  sources:
    - id: trunk
      ref: v1.11.0
      uri: https://github.com/trunk-io/plugins
runtimes:
  enabled:
    - node@22.16.0
    - python@3.14.4
lint:
  definitions:
    - name: trufflehog
      commands:
        - name: lint
          run: trufflehog filesystem --json --fail --no-verification --no-update ${target}
          direct_configs:
            - .trunk/configs/trufflehog_to_sarif.py
          parser:
            runtime: python
            run: python3 .trunk/configs/trufflehog_to_sarif.py
  enabled:
    - actionlint@1.7.12
    - bandit@1.9.4
    - black@26.10.1
    - checkov@3.4.0
    - git-diff-check
    - isort@9.0.2
    - markdownlint@0.50.0
    - pinact@4.1.1!:
        commands: [lint, upgrade]
    - prettier@3.9.10
    - ruff@0.17.3
    - shellcheck@0.11.0
    - shfmt@3.14.1
    - taplo@0.10.0
    - trufflehog@3.99.7
    - yamllint@1.38.0
actions:
  definitions:
    - id: histfix-pre-commit
      description: Check syntax and isolated history tests before committing
      run: make check
      triggers:
        - git_hooks: [pre-commit]
  disabled:
    - trunk-announce
    - trunk-fmt-pre-commit
  enabled:
    - histfix-pre-commit
    - trunk-check-pre-push
    - trunk-upgrade-available
